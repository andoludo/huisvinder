[project]
name = "huisvinder"
version = "0.1.0"
description = "Scraper for Leuven-area (Belgium) real-estate listings"
readme = "README.md"
authors = [
    { name = "aan", email = "andoludovic.andriamamonjy@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "sqlmodel>=0.0.27",
    "alembic>=1.17",
    "requests>=2.32",
    "beautifulsoup4>=4.14",
    "tenacity>=9.1",
    "selenium>=4.38",
    "undetected-chromedriver>=3.5.5",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["huisvinder"]

[tool.pytest.ini_options]
markers = [
    "integration: browser-based tests that need a local Chrome installation",
]

[tool.mypy]
plugins = "pydantic.mypy"
packages = "huisvinder"


follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
show_absolute_path = true
# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true
strict = true
#disable_error_code = "import-untyped"

exclude = [
    "test_*",
    "conftest.py",
]

[[tool.mypy.overrides]]
module = [
    "plotly.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "test_*",
    "conftest.py",
    "*env.py",
]


[tool.ruff.lint]
select = ["E", "W", "F", "B006","RUF","UP","SIM","FURB","PIE","PERF","C4","B","PL","S","C901","N","ANN", "ERA001", "PD"]
ignore = []
extend-ignore = ["ANN101","ANN102","PLR6301","E203","W291","ANN401","PLR2004"]

fixable = ["ALL"]
unfixable = []
