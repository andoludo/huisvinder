[project]
name = "huisvinder"
version = "0.1.0"
description = "Scraper for Leuven-area (Belgium) real-estate listings"
readme = "README.md"
authors = [
    { name = "aan", email = "andoludovic.andriamamonjy@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "sqlmodel>=0.0.27",
    "alembic>=1.17",
    "beautifulsoup4>=4.14",
    "tenacity>=9.1",
    "httpx[http2]>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "mypy>=1.8",
    "ruff>=0.3",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["huisvinder"]

[tool.pytest.ini_options]
addopts = "-m 'not integration' --cov=huisvinder --cov-report=term-missing:skip-covered"
markers = [
    "integration: live tests that hit the real websites",
]

[tool.mypy]
plugins = "pydantic.mypy"
packages = "huisvinder"


follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
show_absolute_path = true
# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true
strict = true
#disable_error_code = "import-untyped"

exclude = [
    "test_*",
    "conftest.py",
    "huisvinder/database/alembic/", # autogenerated migration scaffolding
]

[tool.ruff]
line-length = 120
target-version = "py311"
# alembic env/versions are autogenerated scaffolding
extend-exclude = ["huisvinder/database/alembic"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "RUF",
    "UP",
    "SIM",
    "FURB",
    "PIE",
    "PERF",
    "C4",
    "PL",
    "S",
    "C90",
    "N",
    "ANN",
    "ERA",
    "PD",
]
ignore = [
    "ANN401", # Any is deliberate in JSON-shaped helper signatures
    "PLR2004", # scrapers compare against literal counts/indices constantly
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest asserts
    "ANN", # test signatures need no annotations
]
